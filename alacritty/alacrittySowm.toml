[colors]
[colors.bright]
black = "#a6a69c"
blue = "#7FB4CA"
cyan = "#7AA89F"
green = "#87a987"
magenta = "#938AA9"
red = "#E46876"
white = "#c5c9c5"
yellow = "#E6C384"

[colors.normal]
black = "#0d0c0c"
blue = "#8ba4b0"
cyan = "#8ea4a2"
green = "#8a9a7b"
magenta = "#a292a3"
red = "#c4746e"
white = "#C8C093"
yellow = "#c4b28a"

[colors.primary]
background = "#f8f9fa"
foreground = "#131313"

[colors.selection]
background = "#ffffff"
foreground = "CellForeground"

[font]
size = 8
[font.bold]
family = "Unifont"
style = "Bold"

[font.bold_italic]
family = "Unifont"

[font.italic]
family = "Unifont"
style = "Italic"

[font.normal]
family = "Unifont"
style = "Regular"

[mouse]
hide_when_typing = true

[window]
decorations = "Full"
opacity = 1

[window.padding]
x = 6
y = 2
